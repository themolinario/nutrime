# Typecheck, lint and unit tests on every pull request and on main.
# The "Test" job is a required check: a PR can't be merged until it passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps, as for local installs.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx expo lint

      - name: Unit tests
        run: npx jest --ci
