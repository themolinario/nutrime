<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bricolage'; font-weight: 800; src: url('../../../node_modules/@expo-google-fonts/bricolage-grotesque/800ExtraBold/BricolageGrotesque_800ExtraBold.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 500; src: url('../../../node_modules/@expo-google-fonts/figtree/500Medium/Figtree_500Medium.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 700; src: url('../../../node_modules/@expo-google-fonts/figtree/700Bold/Figtree_700Bold.ttf'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 886px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'Figtree', sans-serif; -webkit-font-smoothing: antialiased; }
  .full { position: absolute; inset: 0; overflow: hidden; }
  .kicker { font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 27px; opacity: .8; }
  h1 { font-family: 'Bricolage'; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; }
  .caption { position: absolute; left: 66px; right: 66px; top: 110px; z-index: 2; }
  .caption h1 { font-size: 80px; margin-top: 18px; }

  /* The phone, moved frame by frame from JS (see window.frame). */
  .phone { position: absolute; left: 115px; top: 497px; width: 656px; height: 1383px; padding: 18px; z-index: 1;
    background: #101311; border-radius: 102px; box-shadow: 0 40px 90px rgba(20, 30, 24, .38), inset 0 0 0 4px #2b302d; }
  .phone img { width: 620px; height: 1347px; border-radius: 86px; display: block; object-fit: cover; }
  .phone::after { content: ''; position: absolute; top: 34px; left: 240px; width: 176px; height: 50px; border-radius: 25px; background: #0a0c0b; }
  .front { position: absolute; inset: 0; z-index: 3; }

  /* Title cards */
  .card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 34px; }
  .icon { width: 230px; height: 230px; border-radius: 54px; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .word { display: inline-block; }
  .card h1 { font-size: 100px; }
  .card p { font-size: 40px; font-weight: 500; line-height: 1.3; opacity: .85; }
  .brand { font-family: 'Bricolage'; font-weight: 800; font-size: 64px; letter-spacing: -0.02em; }
  em { font-style: normal; position: relative; }
  em svg { position: absolute; left: -2%; bottom: -0.18em; width: 104%; height: .34em; overflow: visible; }

  /* Floating icon stickers and soft blobs: the background is never still. */
  .sticker { position: absolute; width: var(--s, 120px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
    box-shadow: 0 18px 40px rgba(0,0,0,.18); animation: pop .7s cubic-bezier(.2,.9,.3,1.3) both, drift 4.5s ease-in-out infinite alternate; }
  .sticker svg { width: 56%; height: 56%; }
  .blob { position: absolute; border-radius: 50%; filter: blur(30px); animation: wander 6s ease-in-out infinite alternate; }

  /* Chips that pop over the phone */
  .chip { position: absolute; display: flex; align-items: center; gap: 18px; background: #fff; color: #1B241E;
    border-radius: 34px; padding: 22px 30px; font-weight: 700; font-size: 31px; white-space: nowrap;
    box-shadow: 0 20px 50px rgba(20, 30, 24, .3); animation: chip .6s cubic-bezier(.2,.9,.3,1.35) both, bob 2.4s ease-in-out infinite alternate; }
  .chip small { display: block; font-weight: 500; font-size: .76em; color: #6E7C72; margin-top: .12em; }
  .chip .dot { width: 66px; height: 66px; border-radius: 20px; display: grid; place-items: center; flex: none; }
  .chip .dot svg { width: 60%; height: 60%; }

  @keyframes pop { 0% { transform: scale(.2) rotate(calc(var(--r, 0deg) - 30deg)); opacity: 0 } 70% { transform: scale(1.1) rotate(var(--r, 0deg)); opacity: 1 } 100% { transform: scale(1) rotate(var(--r, 0deg)) } }
  @keyframes drift { from { translate: 0 0; } to { translate: var(--dx, 18px) var(--dy, -40px); } }
  @keyframes wander { from { transform: translate(0, 0) scale(1) } to { transform: translate(var(--dx, 60px), var(--dy, -80px)) scale(1.15) } }
  @keyframes chip { 0% { transform: scale(.3) rotate(calc(var(--r, 0deg) + 14deg)); opacity: 0 } 65% { transform: scale(1.08) rotate(var(--r, 0deg)); opacity: 1 } 100% { transform: scale(1) rotate(var(--r, 0deg)) } }
  @keyframes bob { from { translate: 0 0 } to { translate: 0 -14px } }
  @keyframes rise { from { transform: translateY(70px) rotate(4deg); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes draw { from { stroke-dashoffset: 260 } to { stroke-dashoffset: 0 } }
  @keyframes popin { 0% { transform: scale(.3) rotate(-14deg); opacity: 0 } 60% { transform: scale(1.08) rotate(3deg); opacity: 1 } 100% { transform: scale(1) rotate(0) } }
  .a-pop { animation: popin .75s cubic-bezier(.2,.9,.3,1.2) both; }
  .a-rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  .a-draw path { stroke-dasharray: 260; animation: draw .6s ease-out both; }
</style>
</head>
<body>
<script src="../icons.js"></script>
<script>
const q = new URLSearchParams(location.search);
const mode = q.get('mode');
const squiggle = (c, delay) => `<svg class="a-draw" viewBox="0 0 200 20" preserveAspectRatio="none"><path style="animation-delay:${delay}s" d="M3 14 C 40 4, 80 18, 120 9 S 180 6, 197 11" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`;
const words = (text, start, step) => text.split(' ').map((w, i) =>
  `<span class="word a-rise" style="animation-delay:${(start + i * step).toFixed(2)}s">${w}</span>`).join(' ');
// A floating sticker: icon name, colours, position, size and drift.
const sticker = (name, color, bg, pos, { s = 120, r = 0, delay = 0, dx = 18, dy = -40 } = {}) =>
  `<div class="sticker" style="${pos}; --s:${s}px; --r:${r}deg; --dx:${dx}px; --dy:${dy}px; background:${bg}; animation-delay:${delay}s, ${delay}s">${icon(name, color)}</div>`;
const blob = (color, pos, size, { dx = 60, dy = -80, o = .5 } = {}) =>
  `<div class="blob" style="${pos}; width:${size}px; height:${size}px; background:${color}; opacity:${o}; --dx:${dx}px; --dy:${dy}px"></div>`;
const chip = (name, color, bg, text, small, pos, { r = 0, at = 1.5, dark = false } = {}) =>
  `<div class="chip" style="${pos}; --r:${r}deg; animation-delay:${at}s, ${at + .6}s; ${dark ? 'background:#1F6B4A; color:#fff' : ''}">
    <span class="dot" style="background:${bg}">${icon(name, color)}</span><span>${text}${small ? `<small>${small}</small>` : ''}</span></div>`;

// Each scene: background, caption, what floats behind the phone (back) and what pops over it (front).
const SCENES = {
  a: {
    bg: 'radial-gradient(120% 80% at 80% 0%, #2A8A60 0%, #1F6B4A 40%, #123A29 100%)', color: '#FBF6EE',
    kicker: 'Oggi', title: 'Il menu di oggi,<br>in un tocco.',
    back: blob('#3FA673', 'left:-120px; top:900px', 520) + blob('#E9A020', 'right:-160px; top:300px', 380, { o: .25, dx: -40, dy: 120 }) +
      sticker('Sparkle', '#E9A020', '#FDF1DC', 'right:60px; top:470px', { s: 110, r: 10, delay: .4 }),
    front: chip('CheckCircle', '#E9A020', '#FDF1DC', 'Colazione fatta', 'un tocco sul pasto', 'right:40px; top:1250px', { r: 4, at: 2.2 }),
  },
  e: {
    bg: 'radial-gradient(110% 70% at 50% 45%, #2C5A40 0%, #173726 45%, #0B1A12 100%)', color: '#FBF6EE',
    kicker: 'La tua pianta', title: 'Ogni giornata<br>la fa crescere.',
    back: blob('#FFD23F', 'left:220px; top:760px', 460, { o: .18, dx: 30, dy: -60 }) +
      sticker('Plant', '#3E9A57', '#E4F0E8', 'left:40px; top:520px', { s: 110, r: -10, delay: .3 }) +
      sticker('Flower', '#FF5E8E', '#FFE4EC', 'right:50px; top:610px', { s: 100, r: 12, delay: .55, dx: -20 }),
    front: chip('Fire', '#D2603A', '#FBEAE3', '5 giorni di fila', 'e la pianta fiorisce', 'left:36px; top:1420px', { r: -4, at: 2.6 }),
  },
  f: {
    bg: 'linear-gradient(170deg, #F0E9F3 0%, #D8C6E4 100%)', color: '#3E2A49',
    kicker: 'Peso', title: 'Il tuo peso,<br>giorno per giorno.',
    back: blob('#B58FCB', 'left:-140px; top:1000px', 520, { o: .45 }) + blob('#FFFFFF', 'right:-100px; top:420px', 360, { o: .5, dx: -50, dy: 90 }) +
      sticker('Scales', '#6B4A7A', '#FFFFFF', 'right:56px; top:480px', { s: 110, r: 8, delay: .35 }),
    front: chip('ChartLineDown', '#1F6B4A', '#E4F0E8', '−2,8 kg', 'nell’ultimo mese', 'right:36px; top:1180px', { r: 4, at: 2.4 }),
  },
  b: {
    bg: 'linear-gradient(170deg, #FDF1DC 0%, #F6D9A4 100%)', color: '#1B241E',
    kicker: 'Le alternative del piano', title: 'Scegli tu,<br>dosi già giuste.',
    back: blob('#F4C77A', 'right:-160px; top:900px', 520, { o: .6 }) +
      sticker('BowlFood', '#D2603A', '#FFFFFF', 'left:40px; top:560px', { s: 110, r: -12, delay: .3 }) +
      sticker('Avocado', '#4E8F3A', '#FFFFFF', 'right:46px; top:620px', { s: 100, r: 10, delay: .5, dx: -16 }),
    front: chip('Scales', '#D2603A', '#FBEAE3', 'Bulgur · g 120', 'quantità dal tuo piano', 'left:40px; top:1500px', { r: -3, at: 1.9 }),
  },
  c: {
    bg: 'linear-gradient(165deg, #E0754E 0%, #C04B28 100%)', color: '#FFF8F2',
    kicker: 'Settimana', title: 'Due settimane<br>in un tocco.',
    back: blob('#F2A27E', 'left:-120px; top:880px', 500, { o: .5 }) +
      sticker('CalendarCheck', '#1F6B4A', '#E4F0E8', 'right:52px; top:520px', { s: 110, r: 8, delay: .35 }),
    front: chip('Sparkle', '#FFFFFF', 'rgba(255,255,255,.16)', 'Compila tutto', '', 'right:40px; top:900px', { r: -5, at: 1.0, dark: true }),
  },
  d: {
    bg: 'linear-gradient(170deg, #EAF4EC 0%, #C5E0CD 100%)', color: '#14432F',
    kicker: 'Lista della spesa', title: 'La spesa si scrive<br>da sola.',
    back: blob('#9CCBAA', 'right:-140px; top:950px', 500, { o: .6 }) +
      sticker('Carrot', '#E07A3F', '#FFFFFF', 'left:36px; top:560px', { s: 105, r: -14, delay: .3 }) +
      sticker('Pepper', '#D2483A', '#FFFFFF', 'right:44px; top:640px', { s: 100, r: 12, delay: .5, dx: -20 }),
    front: chip('ShoppingCart', '#1F6B4A', '#E4F0E8', '101 articoli', 'per 14 giorni, già sommati', 'right:36px; top:1330px', { r: 4, at: 1.8 }),
  },
};

if (mode === 'scene') {
  const s = SCENES[q.get('scene')];
  const cfg = JSON.parse(q.get('cfg'));
  const [first, second] = s.title.split('<br>');
  document.body.innerHTML = `<div class="full" style="background:${s.bg}; color:${s.color}">
    ${s.back}
    <div class="caption"><div class="kicker a-rise" style="animation-delay:.05s">${s.kicker}</div>
      <h1>${words(first, .18, .07)}<br>${words(second, .18 + first.split(' ').length * .07, .07)}</h1></div>
    <div class="phone" id="phone"><img id="screen"></div>
    <div class="front">${s.front}</div></div>`;
  const phone = document.getElementById('phone');
  const screen = document.getElementById('screen');
  phone.style.transformOrigin = `50% ${cfg.focus * 100}%`;
  // Enters (from below or a side), sways gently and slowly pushes in on `focus`.
  window.frame = async (t, src) => {
    window.seek(t);
    const e = Math.pow(Math.max(0, 1 - t / 0.65), 3);
    const zoom = (cfg.zoom[0] + (cfg.zoom[1] - cfg.zoom[0]) * t / cfg.dur) * (1 - (cfg.pop ? 0.3 : 0.14) * e);
    const angle = cfg.tilt * e + 1.1 * Math.sin((2 * Math.PI * t) / 3.4);
    const dx = cfg.from * 640 * e;
    const dy = (cfg.from === 0 ? 260 : 40) * e;
    phone.style.transform = `translate(${dx}px, ${dy}px) rotate(${angle}deg) scale(${zoom})`;
    phone.style.opacity = String(1 - e * (cfg.from === 0 ? 0.6 : 0));
    screen.src = src;
    await screen.decode();
  };
} else if (mode === 'intro') {
  document.body.innerHTML = `<div class="full card" style="background: radial-gradient(120% 80% at 50% 0%, #2A8A60 0%, #1F6B4A 45%, #123A29 100%); color:#FBF6EE; padding: 0 60px">
    ${blob('#3FA673', 'left:-160px; top:1200px', 600)}${blob('#E9A020', 'right:-180px; top:200px', 420, { o: .22, dx: -60, dy: 120 })}
    <img class="icon a-pop" src="../raw/icon.png" style="animation-delay:.05s; position:relative">
    <div class="brand a-rise" style="animation-delay:.4s; position:relative">NutriMy</div>
    <h1 style="margin-top: 40px; position:relative">${words('La tua dieta,', .65, .08)}<br><em>${words('finalmente', .9, .08)}${squiggle('#E9A020', 1.2)}</em> ${words('viva.', 1.02, .08)}</h1>
    ${sticker('Avocado', '#4E8F3A', '#FFFFFF', 'left:70px; top:300px', { s: 130, r: -12, delay: .5 })}
    ${sticker('OrangeSlice', '#E9A020', '#FFFFFF', 'right:80px; top:360px', { s: 120, r: 10, delay: .65, dx: -20 })}
    ${sticker('Carrot', '#E07A3F', '#FFFFFF', 'left:110px; bottom:260px', { s: 120, r: 8, delay: .8, dy: 30 })}
    ${sticker('Flower', '#FF5E8E', '#FFE4EC', 'right:90px; bottom:300px', { s: 130, r: -9, delay: .95, dx: -16, dy: 30 })}
  </div>`;
} else if (mode === 'outro') {
  document.body.innerHTML = `<div class="full card" style="background: linear-gradient(170deg, #FBF6EE 0%, #F1E6D3 100%); color:#1B241E; padding: 0 70px">
    ${blob('#CFE6D6', 'left:-160px; top:1150px', 560, { o: .8 })}${blob('#FDF1DC', 'right:-150px; top:180px', 480, { o: .9, dx: -60, dy: 100 })}
    <img class="icon a-pop" src="../raw/icon.png" style="animation-delay:.05s; position:relative">
    <div class="brand a-rise" style="animation-delay:.3s; color:#1F6B4A; font-size: 92px; position:relative">NutriMy</div>
    <p class="a-rise" style="animation-delay:.5s; position:relative">Dal PDF del nutrizionista<br>al menu di ogni giorno.</p>
    <p class="a-rise" style="animation-delay:.75s; font-size: 32px; font-weight: 700; color:#1F6B4A; opacity: 1; position:relative">Menu · Pianta · Peso · Spesa · Promemoria</p>
    ${sticker('CheckCircle', '#1F6B4A', '#E4F0E8', 'left:90px; top:330px', { s: 110, r: -10, delay: .5 })}
    ${sticker('Plant', '#3E9A57', '#FFFFFF', 'right:90px; top:400px', { s: 110, r: 10, delay: .65, dx: -18 })}
    ${sticker('Scales', '#6B4A7A', '#F0E9F3', 'left:120px; bottom:300px', { s: 110, r: 8, delay: .8, dy: 30 })}
    ${sticker('ShoppingCart', '#D2603A', '#FBEAE3', 'right:110px; bottom:330px', { s: 110, r: -8, delay: .95, dx: -16, dy: 30 })}
  </div>`;
}

// For animated frames: pause everything and let the renderer seek.
window.seek = (seconds) => {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = seconds * 1000; }
};
</script>
</body>
</html>
